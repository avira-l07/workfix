<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iTantra - Tactical UI Stitch Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020408;
      color: #F1F5F9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #0B111E;
      border-bottom: 1px solid #1E293B;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: #00F0FF;
      letter-spacing: 1px;
    }
    .brand-subtitle {
      font-size: 12px;
      color: #64748B;
    }
    .screen-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: #0F172A;
      border: 1px solid #1E293B;
      color: #94A3B8;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      border-color: #00F0FF;
      color: #F1F5F9;
    }
    .tab-btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: #00F0FF;
      color: #00F0FF;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    iframe {
      width: 440px;
      height: 890px;
      border: none;
      background: transparent;
      border-radius: 44px;
      transition: all 0.3s;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div style="width: 10px; height: 10px; border-radius: 50%; background: #10B981; box-shadow: 0 0 10px #10B981;"></div>
      <div>
        <div class="brand-title">iTANTRA // TACTICAL UI SUITE</div>
        <div class="brand-subtitle">Dark HUD Disaster-Relief Transceiver Prototypes</div>
      </div>
    </div>
    <div class="screen-tabs">
      <button class="tab-btn active" onclick="loadScreen('00_transceiver_hub/code.html', this)">00_TRANSCEIVER_HUB</button>
      <button class="tab-btn" onclick="loadScreen('01_connect_radar/code.html', this)">01_CONNECT_RADAR</button>
      <button class="tab-btn" onclick="loadScreen('02_tactical_chat/code.html', this)">02_TACTICAL_CHAT</button>
      <button class="tab-btn" onclick="loadScreen('03_settings/code.html', this)">03_SETTINGS</button>
    </div>
  </header>
  <main>
    <iframe id="previewFrame" src="00_transceiver_hub/code.html"></iframe>
  </main>
  <script>
    function loadScreen(url, btn) {
      document.getElementById('previewFrame').src = url;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
