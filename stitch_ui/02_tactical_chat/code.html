<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iTantra - 1-on-1 Tactical Comms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #080C14;
      --surface-card: #0F172A;
      --surface-bubble-in: #131E34;
      --surface-bubble-out: #0E364E;
      --border-subtle: #1E293B;
      --border-out: #00F0FF;
      --text-main: #F1F5F9;
      --text-muted: #64748B;
      --cyan-hud: #00F0FF;
      --cyan-glow: rgba(0, 240, 255, 0.25);
      --emerald-ready: #10B981;
      --font-ui: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: #030712;
      color: var(--text-main);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .mobile-frame {
      width: 100%;
      max-width: 412px;
      height: 860px;
      background: var(--bg-canvas);
      border-radius: 40px;
      border: 8px solid #1E293B;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 240, 255, 0.08);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top Bar */
    .chat-top-bar {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-card);
      border-bottom: 1px solid var(--border-subtle);
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .peer-profile {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .peer-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .peer-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald-ready);
      box-shadow: 0 0 6px var(--emerald-ready);
    }

    .peer-meta {
      font-size: 10.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-pair-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--cyan-hud);
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* Chat Messages Body */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .date-separator {
      text-align: center;
      margin: 4px 0 8px;
    }

    .date-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Bubbles */
    .bubble {
      max-width: 82%;
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .bubble.in {
      align-self: flex-start;
      background: var(--surface-bubble-in);
      border: 1px solid var(--border-subtle);
    }

    .bubble.out {
      align-self: flex-end;
      background: var(--surface-bubble-out);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .bubble-text {
      font-size: 13.5px;
      line-height: 1.4;
      color: var(--text-main);
    }

    .bubble-subtext {
      font-size: 12px;
      font-style: italic;
      color: #94A3B8;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 4px;
    }

    .bubble-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    .check-receipt {
      color: var(--cyan-hud);
      font-weight: 700;
    }

    /* Audio bubble elements */
    .voice-bubble-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-btn-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--cyan-hud);
      border: none;
      color: var(--bg-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .waveform-strip {
      flex: 1;
      height: 16px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .wave-line {
      width: 2.5px;
      background: var(--cyan-hud);
      border-radius: 2px;
    }

    /* GPS Location Card */
    .gps-bubble-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .gps-header {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--cyan-hud);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .coords-text {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Input Deck */
    .chat-input-deck {
      background: var(--surface-card);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-box {
      flex: 1;
      background: #080C14;
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 13px;
      font-family: var(--font-ui);
      outline: none;
    }

    .input-box:focus {
      border-color: var(--cyan-hud);
    }

    .action-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-icon-btn:hover { color: var(--cyan-hud); }

    .quick-ptt-mic {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan-hud);
      color: var(--cyan-hud);
    }

    .send-btn {
      background: var(--cyan-hud);
      color: var(--bg-canvas);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Top Bar -->
    <div class="chat-top-bar">
      <button class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="peer-profile">
        <div class="peer-title-row">
          <span class="peer-title">MEDIC-02</span>
          <div class="status-dot"></div>
        </div>
        <div class="peer-meta">
          <span>SECURE RFCOMM</span>
          <span>•</span>
          <span class="lang-pair-badge">HI ➔ EN</span>
        </div>
      </div>
    </div>

    <!-- Message Timeline -->
    <div class="chat-body">
      <div class="date-separator">
        <span class="date-pill">TODAY • 14:00 UTC</span>
      </div>

      <!-- Incoming Voice Message -->
      <div class="bubble in">
        <div class="voice-bubble-content">
          <button class="play-btn-circle">▶</button>
          <div class="waveform-strip">
            <div class="wave-line" style="height: 6px;"></div>
            <div class="wave-line" style="height: 14px;"></div>
            <div class="wave-line" style="height: 10px;"></div>
            <div class="wave-line" style="height: 16px;"></div>
            <div class="wave-line" style="height: 8px;"></div>
            <div class="wave-line" style="height: 12px;"></div>
            <div class="wave-line" style="height: 4px;"></div>
          </div>
          <span style="font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);">0:05s</span>
        </div>
        <div class="bubble-text">
          "हम प्राथमिक चिकित्सा केंद्र पर हैं।"
        </div>
        <div class="bubble-subtext">
          "We are at the primary aid station."
        </div>
        <div class="bubble-meta">14:02:10Z</div>
      </div>

      <!-- Incoming GPS Pin -->
      <div class="bubble in">
        <div class="gps-bubble-card">
          <div class="gps-header">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            GRID LOCATION
          </div>
          <span class="coords-text">30.3165° N, 78.0322° E</span>
          <span style="font-size: 10px; color: var(--text-muted);">Dehradun Relief Zone B</span>
        </div>
        <div class="bubble-meta">14:02:44Z</div>
      </div>

      <!-- Outgoing Reply -->
      <div class="bubble out">
        <div class="bubble-text">
          Understood. Helicopter drop ETA 10 minutes. Keep channel 4 clear.
        </div>
        <div class="bubble-meta">
          14:03:12Z
          <span class="check-receipt">✓✓</span>
        </div>
      </div>
    </div>

    <!-- Input Deck -->
    <div class="chat-input-deck">
      <button class="action-icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
      </button>
      <input type="text" class="input-box" placeholder="Type tactical message...">
      <button class="action-icon-btn quick-ptt-mic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
      </button>
      <button class="send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

</body>
</html>
